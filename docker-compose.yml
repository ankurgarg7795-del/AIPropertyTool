# Local stack. `docker compose up` -> web :3000, api :8000, postgres :5432, redis, kafka.
# The MVP API runs fully in-memory; postgres/redis/kafka are provisioned so the
# production adapters (backend/sql, docs/ARCHITECTURE.md) can be developed against them.
services:
  api:
    build: ./backend
    env_file: .env
    ports: ["8000:8000"]
    depends_on: [postgres]
  web:
    build: ./frontend
    environment:
      BACKEND_URL: http://api:8000
    ports: ["3000:3000"]
    depends_on: [api]
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: aiproperty
    ports: ["5432:5432"]
    volumes:
      - ./backend/sql:/docker-entrypoint-initdb.d:ro
  redis:
    image: redis:7-alpine
  kafka:
    image: bitnami/kafka:3.8
    environment:
      KAFKA_CFG_NODE_ID: "0"
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
