# Local stack. `cp .env.example .env && docker compose up` -> web :3000, api :8000, postgres :5432.
# The API applies backend/sql migrations itself on startup (APT_AUTO_MIGRATE).
services:
  api:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/aiproperty
      APT_MEDIA_DIR: /data/media
    ports: ["8000:8000"]
    volumes:
      - media:/data/media
    depends_on:
      postgres:
        condition: service_healthy
  web:
    build: ./frontend
    ports: ["3000:3000"]
    depends_on: [api]
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: aiproperty
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      retries: 30
  # Provisioned for the production event relay / caches (not used by the MVP process yet).
  redis:
    image: redis:7-alpine
  kafka:
    image: bitnami/kafka:3.8
    environment:
      KAFKA_CFG_NODE_ID: "0"
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
volumes:
  pgdata:
  media:
